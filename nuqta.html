<title>Nuqta Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0b111d;
    --ink-2:#121a2a;
    --ink-3:#1a2437;
    --sand:#e2d3b4;
    --brass:#c49a3c;
    --amber:#e8b23d;
    --sun:#e08a4a;
    --steel:#4f8fc0;
    --moss:#93a866;
    --violet:#a686e0;
    --go:#7fbf7a;
    --stop:#e0684f;
    --line:rgba(226,211,180,.15);
    --text:#f0e9d9;
    --text-dim:rgba(240,233,217,.60);
    --text-faint:rgba(240,233,217,.36);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--ink);color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;appearance:none;-webkit-appearance:none;}
  #scene{position:fixed;inset:0;z-index:0;cursor:grab;}
  #scene.dragging{cursor:grabbing;}
  #scene canvas{display:block;width:100%;height:100%;}

  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;padding:20px;}
  #hud.ready .panel{opacity:1;transform:translateY(0);}
  .panel{opacity:0;transform:translateY(-8px);
    transition:opacity .7s ease, transform .7s ease;pointer-events:auto;}
  #hud.ready .p2{transition-delay:.08s;}
  #hud.ready .p3{transition-delay:.16s;}
  .glass{
    background:linear-gradient(180deg,rgba(20,29,46,.90),rgba(10,15,26,.82));
    border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
               0 18px 50px -22px rgba(0,0,0,.65),
               0 0 42px -14px var(--glow, transparent);
  }
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .row-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}

  .wordmark{padding:11px 18px 10px;}
  .wordmark .brand{
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:27px;
    letter-spacing:.11em;line-height:1;color:var(--sand);
  }
  .wordmark .brand i{font-style:normal;color:var(--brass);}
  .wordmark .brand2{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:13.5px;
    letter-spacing:.30em;line-height:1;color:var(--brass);margin-top:4px;
  }
  .wordmark .sub{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;
    color:var(--text-faint);margin-top:7px;padding-top:7px;text-transform:uppercase;
    border-top:1px solid var(--line);
  }

  .top-right{display:flex;gap:8px;align-items:stretch;}
  .clocks{display:flex;}
  .clk{padding:9px 15px;border-right:1px solid var(--line);text-align:right;min-width:96px;}
  .clk:last-child{border-right:none;}
  .clk .n{
    font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--text);
  }
  .clk .n.warn{color:var(--amber);}
  .clk .l{
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.13em;
    color:var(--text-faint);margin-top:5px;text-transform:uppercase;
  }
  .ibtn{
    min-width:34px;padding:0 11px;
    background:linear-gradient(180deg,rgba(18,26,42,.88),rgba(11,17,29,.78));
    border:1px solid var(--line);border-radius:2px;color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;display:flex;align-items:center;justify-content:center;
    cursor:pointer;backdrop-filter:blur(8px);
    transition:color .15s ease,border-color .15s ease,background .15s ease;
  }
  .ibtn:hover{color:var(--sand);border-color:rgba(226,211,180,.38);}
  .ibtn.on{color:var(--ink);background:var(--sand);border-color:var(--sand);}
  .btncol{display:flex;flex-direction:column;gap:4px;}
  .btncol .ibtn{height:34px;font-size:14px;}

  .compass{width:60px;height:60px;border-radius:50%;position:relative;flex:none;}
  .compass .n{position:absolute;top:5px;left:50%;transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--brass);}
  .compass .needle{position:absolute;left:50%;top:50%;width:2px;height:20px;
    background:var(--sand);transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(45deg);border-radius:2px;
    transition:transform .5s cubic-bezier(.22,.9,.3,1);}
  .compass .hub{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
    background:var(--brass);transform:translate(-50%,-50%);}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    color:var(--text-faint);text-transform:uppercase;padding:8px 12px;}

  /* signals panel */
  #sig{
    position:fixed;top:86px;right:20px;bottom:96px;width:312px;z-index:10;
    display:flex;flex-direction:column;overflow:hidden;
    transition:opacity .3s ease, transform .3s ease;
  }
  .sig-head{padding:13px 15px 11px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .sig-head h2{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:16px;letter-spacing:.08em;color:var(--sand);text-transform:uppercase;}
  .count{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.11em;
    color:var(--text-faint);border:1px solid var(--line);border-radius:2px;
    padding:3px 6px;text-transform:uppercase;white-space:nowrap;}
  .count.warn{color:var(--amber);border-color:rgba(232,178,61,.42);}
  .sig-filter{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-faint);background:transparent;
    border:1px solid var(--line);border-radius:2px;padding:5px 8px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease,background .15s ease;}
  .chip:hover{color:var(--text-dim);}
  .chip.on{color:var(--ink);background:var(--sand);border-color:var(--sand);}
  .sig-list{flex:1;overflow-y:auto;padding:6px;}

  .grp{margin-bottom:8px;}
  .grp-head{display:flex;align-items:center;gap:7px;padding:8px 9px 6px;cursor:pointer;}
  .grp-head .tag{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:11px;letter-spacing:.05em;color:var(--ink);background:var(--accent);
    padding:2px 5px;border-radius:2px;}
  .grp-head .nm{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
    color:var(--text-faint);text-transform:uppercase;flex:1;}
  .src{font-family:'IBM Plex Mono',monospace;font-size:7.5px;letter-spacing:.1em;
    text-transform:uppercase;padding:2px 5px;border-radius:2px;border:1px solid var(--line);
    color:var(--text-faint);white-space:nowrap;}
  .src.live{color:var(--go);border-color:rgba(127,191,122,.4);}
  .src.dormant{color:var(--text-faint);opacity:.7;}

  .row{
    display:flex;gap:9px;padding:10px;border-radius:2px;margin-bottom:3px;cursor:pointer;
    border:1px solid transparent;border-left:3px solid var(--accent);
    background:rgba(255,255,255,.02);
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .row:hover{background:rgba(255,255,255,.05);transform:translateX(1px);}
  .row.active{background:rgba(255,255,255,.07);border-color:var(--line);}
  .row.needs{border-color:rgba(232,178,61,.5);}
  .row.done{opacity:.45;}
  .row .tick{
    width:15px;height:15px;flex:none;margin-top:2px;border-radius:2px;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--go);line-height:1;
  }
  .row.done .tick{border-color:rgba(127,191,122,.5);}
  .row .bd{min-width:0;flex:1;}
  .row .t1{display:flex;justify-content:space-between;align-items:baseline;gap:7px;}
  .row .ttl{font-size:12.5px;font-weight:500;line-height:1.35;}
  .row.done .ttl{text-decoration:line-through;}
  .row .st{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;
    text-transform:uppercase;flex:none;color:var(--text-faint);}
  .row .st.warn{color:var(--amber);}
  .row .st.ok{color:var(--go);}
  .row .jump{flex:none;align-self:center;width:22px;height:22px;margin-left:2px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:transparent;border:1px solid transparent;border-radius:2px;
    color:var(--text-faint);font-size:13px;line-height:1;opacity:0;transition:opacity .15s ease;}
  .row:hover .jump{opacity:1;}
  .row .jump:hover{color:var(--sand);border-color:var(--line);}
  .row .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);
    margin-top:3px;line-height:1.4;}
  .arch{display:flex;align-items:center;gap:6px;padding:6px 10px 7px;margin-top:2px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--text-faint);}
  .arch:hover{color:var(--text-dim);}
  .arch .cv{font-size:10px;transition:transform .18s ease;}
  .arch.open .cv{transform:rotate(90deg);}

  .empty{padding:20px 16px;font-size:12.5px;color:var(--text-faint);font-style:italic;}

  .sig-foot{padding:9px 15px;border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;
    color:var(--text-faint);display:flex;justify-content:space-between;gap:8px;}
  .sig-foot .dot{width:5px;height:5px;border-radius:50%;background:var(--go);
    display:inline-block;margin-right:5px;vertical-align:middle;}
  .sig-foot .dot.bad{background:var(--stop);}
  .sig-foot .dot.idle{background:var(--text-faint);}

  /* connector notice */
  .notice{
    margin:6px;padding:11px 12px;border:1px solid rgba(232,178,61,.32);
    background:rgba(232,178,61,.07);border-radius:2px;
  }
  .notice.bad{border-color:rgba(224,104,79,.35);background:rgba(224,104,79,.07);}
  .notice h4{margin:0 0 5px;font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--amber);font-weight:500;}
  .notice.bad h4{color:var(--stop);}
  .notice p{margin:0;font-size:11.5px;line-height:1.5;color:var(--text-dim);}

  /* mail — deliberately off to the side. Nothing in a business inbox
     earns the middle of the screen until a person is actually writing to you. */
  #mailp{
    position:fixed;left:20px;top:130px;width:246px;z-index:10;
    overflow:hidden;
  }
  #mailp .mh{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text-faint);}
  #mailp .mh:hover{color:var(--text-dim);}
  #mailp .mh .k{flex:1;}
  #mailp .mh .v{color:var(--text-dim);letter-spacing:.06em;}
  #mailp .mh .v.warn{color:var(--amber);}
  #mailp .mh .cv{transition:transform .2s ease;font-size:11px;}
  #mailp.open .mh .cv{transform:rotate(90deg);}
  #mailp .mb{display:none;border-top:1px solid var(--line);padding:4px;max-height:250px;overflow-y:auto;}
  #mailp.open .mb{display:block;}
  #mailp .mrow{padding:7px 8px;border-radius:2px;cursor:pointer;}
  #mailp .mrow:hover{background:rgba(226,211,180,.05);}
  #mailp .mrow .s{font-size:12px;color:var(--text);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  #mailp .mrow .f{font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:var(--text-faint);margin-top:3px;}
  #mailp .mnote{padding:11px 10px;font-size:11.5px;line-height:1.5;
    color:var(--text-faint);font-style:italic;}

  /* workstream status control, in the drawer footer */
  .wsel{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;background:var(--ink-3);color:var(--text-dim);
    border:1px solid var(--line);border-radius:2px;padding:0 8px;height:34px;
    cursor:pointer;outline:none;}
  .wsel:hover{color:var(--sand);}

  /* drawer */
  #dw{position:fixed;inset:0;z-index:15;display:flex;justify-content:flex-end;pointer-events:none;}
  #dw.open{pointer-events:auto;}
  #dwScrim{position:absolute;inset:0;background:rgba(5,8,14,0);transition:background .25s ease;}
  #dw.open #dwScrim{background:rgba(5,8,14,.45);}
  #drawer{
    position:relative;width:378px;max-width:88vw;height:100%;
    background:linear-gradient(180deg,#131c2c,#0d1421);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.9,.3,1);
    display:flex;flex-direction:column;
  }
  #dw.open #drawer{transform:translateX(0);}
  #drawer .hd{padding:18px 20px 14px;border-bottom:1px solid var(--line);}
  #drawer .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:7px;}
  #drawer h3{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:23px;letter-spacing:.02em;color:var(--sand);line-height:1.15;}
  #drawer .sub{margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .close{position:absolute;top:15px;right:15px;width:27px;height:27px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
    border-radius:2px;color:var(--text-dim);background:transparent;}
  .close:hover{color:var(--sand);}
  #drawer .bd{flex:1;overflow-y:auto;padding:18px 20px;}
  .sec{margin-bottom:20px;}
  .lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;}
  .sec p{margin:0;font-size:14px;line-height:1.6;color:var(--text);}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:8px 14px;font-size:13px;}
  .kv dt{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--text-faint);padding-top:2px;}
  .kv dd{margin:0;}
  .why{border-left:2px solid var(--amber);padding:10px 0 10px 14px;
    font-size:13.5px;line-height:1.55;color:var(--text-dim);}
  #drawer .ft{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:8px;}
  .btn{flex:1;padding:11px 12px;border-radius:2px;border:1px solid var(--line);
    font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;
    background:transparent;color:var(--text);
    transition:filter .15s ease,transform .1s ease;}
  .btn:hover{filter:brightness(1.25);}
  .btn:active{transform:translateY(1px);}
  .btn.pri{background:#4a7a4a;border-color:#4a7a4a;color:#eef7ea;}
  .btn.undo{border-color:rgba(226,211,180,.3);}
  .btn.link{border-color:rgba(196,154,60,.45);color:var(--brass);}
  .ftnote{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:11px 0;}

  .grp-head .talk{flex:none;width:20px;height:20px;border:1px solid var(--line);border-radius:2px;
    background:transparent;color:var(--text-faint);cursor:pointer;font-size:10px;
    display:flex;align-items:center;justify-content:center;transition:color .15s ease,border-color .15s ease;}
  .grp-head .talk:hover{color:var(--sand);border-color:rgba(226,211,180,.4);}

  /* agent panel — a per-company chat, modeled on the drawer but wider so a
     conversation has room to breathe */
  #ap{position:fixed;inset:0;z-index:16;display:flex;justify-content:flex-end;pointer-events:none;}
  #ap.open{pointer-events:auto;}
  #apScrim{position:absolute;inset:0;background:rgba(5,8,14,0);transition:background .25s ease;}
  #ap.open #apScrim{background:rgba(5,8,14,.5);}
  #agentPanel{
    position:relative;width:440px;max-width:92vw;height:100%;--accent-rgb:196,154,60;
    background:linear-gradient(180deg,#141b2c,#0c121f);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.9,.3,1);
    display:flex;flex-direction:column;
    box-shadow:0 0 70px -20px rgba(var(--accent-rgb),.4), inset 1px 0 0 rgba(255,255,255,.04);
  }
  #ap.open #agentPanel{transform:translateX(0);}
  #agentPanel .bd{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;}
  .msg.user{align-self:flex-end;color:var(--text);border-bottom-right-radius:3px;
    background:linear-gradient(180deg,#3c4c6a,#2b3a54);}
  .msg.agent{align-self:flex-start;color:var(--text);border-bottom-left-radius:3px;
    background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.25);}
  .msg.agent.err{background:rgba(224,104,79,.10);border-color:rgba(224,104,79,.35);
    color:var(--text-dim);font-size:12.5px;}
  .msg .cursor{opacity:.6;animation:blink 1s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}
  .ap-input{display:flex;gap:8px;align-items:flex-end;padding:14px 18px;border-top:1px solid var(--line);}
  .ap-input textarea{flex:1;resize:none;max-height:120px;background:var(--ink-3);color:var(--text);
    border:1px solid var(--line);border-radius:3px;padding:9px 11px;font:inherit;font-size:13px;
    line-height:1.4;outline:none;transition:border-color .15s ease;}
  .ap-input textarea:focus{border-color:rgba(var(--accent-rgb),.5);}
  .ap-input .btn{flex:none;width:74px;}
  .ap-input .btn:disabled{opacity:.4;cursor:default;filter:none;}

  /* exec */
  #execLayer{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;
    transition:opacity .35s ease;}
  body.exec #execLayer{opacity:1;}
  body.exec #sig{opacity:0;pointer-events:none;transform:translateX(12px);}
  body.exec #hud .panel.hint{opacity:0;}
  .ecard{
    position:absolute;top:0;left:0;pointer-events:auto;cursor:pointer;min-width:196px;
    padding:12px 14px;border-radius:2px;
    background:linear-gradient(180deg,rgba(18,26,42,.95),rgba(11,17,29,.92));
    border:1px solid var(--line);border-left:3px solid var(--accent);
    backdrop-filter:blur(8px);transition:border-color .2s ease,filter .15s ease;
  }
  .ecard:hover{filter:brightness(1.2);}
  .ecard.alert{border-color:rgba(232,178,61,.6);}
  .ecard .en{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;
    letter-spacing:.04em;color:var(--sand);text-transform:uppercase;margin-bottom:5px;}
  .ecard .es{display:flex;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:var(--text-dim);letter-spacing:.03em;flex-wrap:wrap;}
  .ecard .es .w{color:var(--amber);}
  .ecard .bar{margin-top:8px;height:3px;background:rgba(240,233,217,.12);border-radius:2px;overflow:hidden;}
  .ecard .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;}

  #loading{position:fixed;inset:0;z-index:20;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
    transition:opacity .6s ease;}
  #loading .w{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:34px;
    letter-spacing:.16em;color:var(--sand);}
  #loading .w i{font-style:normal;color:var(--brass);}
  #loading .w2{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.42em;color:var(--brass);margin-top:-4px;}
  #loading .b{width:170px;height:2px;background:var(--ink-3);border-radius:2px;overflow:hidden;}
  #loading .b i{display:block;height:100%;width:0;background:var(--brass);transition:width .25s ease;}
  #loading .t{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;
    color:var(--text-faint);text-transform:uppercase;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:3px;}

  @media (max-width:780px){
    #sig{width:min(80vw,312px);bottom:88px;}
    .wordmark .brand{font-size:21px;}
    .clk{min-width:78px;padding:8px 11px;}
    .clk .n{font-size:16px;}
    .ecard{min-width:150px;padding:9px 11px;}

<script>
"use strict";

  /* ==================== boot ==================== */

  var bar = document.getElementById('loadbar'), pct = 0;
  var boot = setInterval(function(){
    pct = Math.min(100, pct + 9 + Math.random()*11);
    bar.style.width = pct+'%';
    if (pct >= 100){
      clearInterval(boot);
      setTimeout(function(){
        document.getElementById('loading').style.opacity='0';
        document.getElementById('hud').classList.add('ready');
        setTimeout(function(){ document.getElementById('loading').style.display='none'; }, 650);
      }, 200);
    }
  }, 85);

  render();
  renderDealPillars();
  renderWorkers();
  initDb();
  initAgent();
  startFeed();
  startMailFeed();
  setInterval(renderClocks, 60000);
  animate();

</script>
