<title>Nuqta Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0b111d;
    --ink-2:#121a2a;
    --ink-3:#1a2437;
    --sand:#e2d3b4;
    --brass:#c49a3c;
    --amber:#e8b23d;
    --sun:#e08a4a;
    --steel:#4f8fc0;
    --moss:#93a866;
    --violet:#a686e0;
    --go:#7fbf7a;
    --stop:#e0684f;
    --line:rgba(226,211,180,.15);
    --text:#f0e9d9;
    --text-dim:rgba(240,233,217,.60);
    --text-faint:rgba(240,233,217,.36);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--ink);color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;appearance:none;-webkit-appearance:none;}
  #scene{position:fixed;inset:0;z-index:0;cursor:grab;}
  #scene.dragging{cursor:grabbing;}
  #scene canvas{display:block;width:100%;height:100%;}

  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;padding:20px;}
  #hud.ready .panel{opacity:1;transform:translateY(0);}
  .panel{opacity:0;transform:translateY(-8px);
    transition:opacity .7s ease, transform .7s ease;pointer-events:auto;}
  #hud.ready .p2{transition-delay:.08s;}
  #hud.ready .p3{transition-delay:.16s;}
  .glass{
    background:linear-gradient(180deg,rgba(18,26,42,.88),rgba(11,17,29,.78));
    border:1px solid var(--line);border-radius:2px;backdrop-filter:blur(8px);
  }
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .row-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}

  .wordmark{padding:11px 18px 10px;}
  .wordmark .brand{
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:27px;
    letter-spacing:.11em;line-height:1;color:var(--sand);
  }
  .wordmark .brand i{font-style:normal;color:var(--brass);}
  .wordmark .brand2{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:13.5px;
    letter-spacing:.30em;line-height:1;color:var(--brass);margin-top:4px;
  }
  .wordmark .sub{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;
    color:var(--text-faint);margin-top:7px;padding-top:7px;text-transform:uppercase;
    border-top:1px solid var(--line);
  }

  .top-right{display:flex;gap:8px;align-items:stretch;}
  .clocks{display:flex;}
  .clk{padding:9px 15px;border-right:1px solid var(--line);text-align:right;min-width:96px;}
  .clk:last-child{border-right:none;}
  .clk .n{
    font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--text);
  }
  .clk .n.warn{color:var(--amber);}
  .clk .l{
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.13em;
    color:var(--text-faint);margin-top:5px;text-transform:uppercase;
  }
  .ibtn{
    min-width:34px;padding:0 11px;
    background:linear-gradient(180deg,rgba(18,26,42,.88),rgba(11,17,29,.78));
    border:1px solid var(--line);border-radius:2px;color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;display:flex;align-items:center;justify-content:center;
    cursor:pointer;backdrop-filter:blur(8px);
    transition:color .15s ease,border-color .15s ease,background .15s ease;
  }
  .ibtn:hover{color:var(--sand);border-color:rgba(226,211,180,.38);}
  .ibtn.on{color:var(--ink);background:var(--sand);border-color:var(--sand);}
  .btncol{display:flex;flex-direction:column;gap:4px;}
  .btncol .ibtn{height:34px;font-size:14px;}

  .compass{width:60px;height:60px;border-radius:50%;position:relative;flex:none;}
  .compass .n{position:absolute;top:5px;left:50%;transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--brass);}
  .compass .needle{position:absolute;left:50%;top:50%;width:2px;height:20px;
    background:var(--sand);transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(45deg);border-radius:2px;
    transition:transform .5s cubic-bezier(.22,.9,.3,1);}
  .compass .hub{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
    background:var(--brass);transform:translate(-50%,-50%);}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    color:var(--text-faint);text-transform:uppercase;padding:8px 12px;}

  /* signals panel */
  #sig{
    position:fixed;top:86px;right:20px;bottom:96px;width:312px;z-index:10;
    display:flex;flex-direction:column;overflow:hidden;
    transition:opacity .3s ease, transform .3s ease;
  }
  .sig-head{padding:13px 15px 11px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .sig-head h2{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:16px;letter-spacing:.08em;color:var(--sand);text-transform:uppercase;}
  .count{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.11em;
    color:var(--text-faint);border:1px solid var(--line);border-radius:2px;
    padding:3px 6px;text-transform:uppercase;white-space:nowrap;}
  .count.warn{color:var(--amber);border-color:rgba(232,178,61,.42);}
  .sig-filter{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-faint);background:transparent;
    border:1px solid var(--line);border-radius:2px;padding:5px 8px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease,background .15s ease;}
  .chip:hover{color:var(--text-dim);}
  .chip.on{color:var(--ink);background:var(--sand);border-color:var(--sand);}
  .sig-list{flex:1;overflow-y:auto;padding:6px;}

  .grp{margin-bottom:8px;}
  .grp-head{display:flex;align-items:center;gap:7px;padding:8px 9px 6px;cursor:pointer;}
  .grp-head .tag{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:11px;letter-spacing:.05em;color:var(--ink);background:var(--accent);
    padding:2px 5px;border-radius:2px;}
  .grp-head .nm{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
    color:var(--text-faint);text-transform:uppercase;flex:1;}
  .src{font-family:'IBM Plex Mono',monospace;font-size:7.5px;letter-spacing:.1em;
    text-transform:uppercase;padding:2px 5px;border-radius:2px;border:1px solid var(--line);
    color:var(--text-faint);white-space:nowrap;}
  .src.live{color:var(--go);border-color:rgba(127,191,122,.4);}
  .src.dormant{color:var(--text-faint);opacity:.7;}

  .row{
    display:flex;gap:9px;padding:10px;border-radius:2px;margin-bottom:3px;cursor:pointer;
    border:1px solid transparent;border-left:3px solid var(--accent);
    background:rgba(255,255,255,.02);
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .row:hover{background:rgba(255,255,255,.05);transform:translateX(1px);}
  .row.active{background:rgba(255,255,255,.07);border-color:var(--line);}
  .row.needs{border-color:rgba(232,178,61,.5);}
  .row.done{opacity:.45;}
  .row .tick{
    width:15px;height:15px;flex:none;margin-top:2px;border-radius:2px;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--go);line-height:1;
  }
  .row.done .tick{border-color:rgba(127,191,122,.5);}
  .row .bd{min-width:0;flex:1;}
  .row .t1{display:flex;justify-content:space-between;align-items:baseline;gap:7px;}
  .row .ttl{font-size:12.5px;font-weight:500;line-height:1.35;}
  .row.done .ttl{text-decoration:line-through;}
  .row .st{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;
    text-transform:uppercase;flex:none;color:var(--text-faint);}
  .row .st.warn{color:var(--amber);}
  .row .st.ok{color:var(--go);}
  .row .jump{flex:none;align-self:center;width:22px;height:22px;margin-left:2px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:transparent;border:1px solid transparent;border-radius:2px;
    color:var(--text-faint);font-size:13px;line-height:1;opacity:0;transition:opacity .15s ease;}
  .row:hover .jump{opacity:1;}
  .row .jump:hover{color:var(--sand);border-color:var(--line);}
  .row .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);
    margin-top:3px;line-height:1.4;}
  .arch{display:flex;align-items:center;gap:6px;padding:6px 10px 7px;margin-top:2px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--text-faint);}
  .arch:hover{color:var(--text-dim);}
  .arch .cv{font-size:10px;transition:transform .18s ease;}
  .arch.open .cv{transform:rotate(90deg);}

  .empty{padding:20px 16px;font-size:12.5px;color:var(--text-faint);font-style:italic;}

  .sig-foot{padding:9px 15px;border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;
    color:var(--text-faint);display:flex;justify-content:space-between;gap:8px;}
  .sig-foot .dot{width:5px;height:5px;border-radius:50%;background:var(--go);
    display:inline-block;margin-right:5px;vertical-align:middle;}
  .sig-foot .dot.bad{background:var(--stop);}
  .sig-foot .dot.idle{background:var(--text-faint);}

  /* connector notice */
  .notice{
    margin:6px;padding:11px 12px;border:1px solid rgba(232,178,61,.32);
    background:rgba(232,178,61,.07);border-radius:2px;
  }
  .notice.bad{border-color:rgba(224,104,79,.35);background:rgba(224,104,79,.07);}
  .notice h4{margin:0 0 5px;font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--amber);font-weight:500;}
  .notice.bad h4{color:var(--stop);}
  .notice p{margin:0;font-size:11.5px;line-height:1.5;color:var(--text-dim);}

  /* mail — deliberately off to the side. Nothing in a business inbox
     earns the middle of the screen until a person is actually writing to you. */
  #mailp{
    position:fixed;left:20px;top:130px;width:246px;z-index:10;
    overflow:hidden;
  }
  #mailp .mh{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text-faint);}
  #mailp .mh:hover{color:var(--text-dim);}
  #mailp .mh .k{flex:1;}
  #mailp .mh .v{color:var(--text-dim);letter-spacing:.06em;}
  #mailp .mh .v.warn{color:var(--amber);}
  #mailp .mh .cv{transition:transform .2s ease;font-size:11px;}
  #mailp.open .mh .cv{transform:rotate(90deg);}
  #mailp .mb{display:none;border-top:1px solid var(--line);padding:4px;max-height:250px;overflow-y:auto;}
  #mailp.open .mb{display:block;}
  #mailp .mrow{padding:7px 8px;border-radius:2px;cursor:pointer;}
  #mailp .mrow:hover{background:rgba(226,211,180,.05);}
  #mailp .mrow .s{font-size:12px;color:var(--text);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  #mailp .mrow .f{font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:var(--text-faint);margin-top:3px;}
  #mailp .mnote{padding:11px 10px;font-size:11.5px;line-height:1.5;
    color:var(--text-faint);font-style:italic;}

  /* workstream status control, in the drawer footer */
  .wsel{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;background:var(--ink-3);color:var(--text-dim);
    border:1px solid var(--line);border-radius:2px;padding:0 8px;height:34px;
    cursor:pointer;outline:none;}
  .wsel:hover{color:var(--sand);}

  /* drawer */
  #dw{position:fixed;inset:0;z-index:15;display:flex;justify-content:flex-end;pointer-events:none;}
  #dw.open{pointer-events:auto;}
  #dwScrim{position:absolute;inset:0;background:rgba(5,8,14,0);transition:background .25s ease;}
  #dw.open #dwScrim{background:rgba(5,8,14,.45);}
  #drawer{
    position:relative;width:378px;max-width:88vw;height:100%;
    background:linear-gradient(180deg,#131c2c,#0d1421);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.9,.3,1);
    display:flex;flex-direction:column;
  }
  #dw.open #drawer{transform:translateX(0);}
  #drawer .hd{padding:18px 20px 14px;border-bottom:1px solid var(--line);}
  #drawer .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:7px;}
  #drawer h3{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:23px;letter-spacing:.02em;color:var(--sand);line-height:1.15;}
  #drawer .sub{margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .close{position:absolute;top:15px;right:15px;width:27px;height:27px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
    border-radius:2px;color:var(--text-dim);background:transparent;}
  .close:hover{color:var(--sand);}
  #drawer .bd{flex:1;overflow-y:auto;padding:18px 20px;}
  .sec{margin-bottom:20px;}
  .lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;}
  .sec p{margin:0;font-size:14px;line-height:1.6;color:var(--text);}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:8px 14px;font-size:13px;}
  .kv dt{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--text-faint);padding-top:2px;}
  .kv dd{margin:0;}
  .why{border-left:2px solid var(--amber);padding:10px 0 10px 14px;
    font-size:13.5px;line-height:1.55;color:var(--text-dim);}
  #drawer .ft{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:8px;}
  .btn{flex:1;padding:11px 12px;border-radius:2px;border:1px solid var(--line);
    font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;
    background:transparent;color:var(--text);
    transition:filter .15s ease,transform .1s ease;}
  .btn:hover{filter:brightness(1.25);}
  .btn:active{transform:translateY(1px);}
  .btn.pri{background:#4a7a4a;border-color:#4a7a4a;color:#eef7ea;}
  .btn.undo{border-color:rgba(226,211,180,.3);}
  .btn.link{border-color:rgba(196,154,60,.45);color:var(--brass);}
  .ftnote{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:11px 0;}

  /* exec */
  #execLayer{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;
    transition:opacity .35s ease;}
  body.exec #execLayer{opacity:1;}
  body.exec #sig{opacity:0;pointer-events:none;transform:translateX(12px);}
  body.exec #hud .panel.hint{opacity:0;}
  .ecard{
    position:absolute;top:0;left:0;pointer-events:auto;cursor:pointer;min-width:196px;
    padding:12px 14px;border-radius:2px;
    background:linear-gradient(180deg,rgba(18,26,42,.95),rgba(11,17,29,.92));
    border:1px solid var(--line);border-left:3px solid var(--accent);
    backdrop-filter:blur(8px);transition:border-color .2s ease,filter .15s ease;
  }
  .ecard:hover{filter:brightness(1.2);}
  .ecard.alert{border-color:rgba(232,178,61,.6);}
  .ecard .en{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;
    letter-spacing:.04em;color:var(--sand);text-transform:uppercase;margin-bottom:5px;}
  .ecard .es{display:flex;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:var(--text-dim);letter-spacing:.03em;flex-wrap:wrap;}
  .ecard .es .w{color:var(--amber);}
  .ecard .bar{margin-top:8px;height:3px;background:rgba(240,233,217,.12);border-radius:2px;overflow:hidden;}
  .ecard .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;}

  #loading{position:fixed;inset:0;z-index:20;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
    transition:opacity .6s ease;}
  #loading .w{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:34px;
    letter-spacing:.16em;color:var(--sand);}
  #loading .w i{font-style:normal;color:var(--brass);}
  #loading .w2{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.42em;color:var(--brass);margin-top:-4px;}
  #loading .b{width:170px;height:2px;background:var(--ink-3);border-radius:2px;overflow:hidden;}
  #loading .b i{display:block;height:100%;width:0;background:var(--brass);transition:width .25s ease;}
  #loading .t{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;
    color:var(--text-faint);text-transform:uppercase;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:3px;}

  @media (max-width:780px){
    #sig{width:min(80vw,312px);bottom:88px;}
    .wordmark .brand{font-size:21px;}
    .clk{min-width:78px;padding:8px 11px;}
    .clk .n{font-size:16px;}
    .ecard{min-width:150px;padding:9px 11px;}
  }
</style>

<div id="loading">
  <div class="w">NU<i>Q</i>TA</div>
  <div class="w2">INTELLIGENCE</div>
  <div class="b"><i id="loadbar"></i></div>
  <div class="t">Opening the basin</div>
</div>

<div id="scene"></div>

<div id="hud">
  <div class="row-top">
    <div class="panel glass wordmark">
      <div class="brand">NU<i>Q</i>TA</div>
      <div class="brand2">INTELLIGENCE</div>
      <div class="sub">Anwar Ventures LLC &middot; Los Angeles</div>
    </div>
    <div class="panel p2 top-right">
      <div class="glass clocks">
        <div class="clk"><div class="n" id="gateN">—</div><div class="l">To 30 Nov gate</div></div>
        <div class="clk"><div class="n" id="wedN">—</div><div class="l">To the wedding</div></div>
      </div>
      <button class="ibtn" id="execBtn" title="Executive view">Exec</button>
      <div class="btncol">
        <button class="ibtn" id="zin" title="Zoom in">+</button>
        <button class="ibtn" id="zout" title="Zoom out">&minus;</button>
      </div>
    </div>
  </div>

  <div class="row-bottom">
    <div style="display:flex;align-items:center;gap:9px;">
      <div class="panel p3 glass compass">
        <div class="n">N</div><div class="needle" id="needle"></div><div class="hub"></div>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="panel p3 ibtn" id="rotL" style="height:34px;font-size:14px;" title="Rotate left">&#8634;</button>
        <button class="panel p3 ibtn" id="rotR" style="height:34px;font-size:14px;" title="Rotate right">&#8635;</button>
      </div>
    </div>
    <div class="panel p3 glass hint">Drag or WASD to pan &middot; scroll to pan, pinch to zoom &middot; right-drag or Q/E to turn &middot; F to reset</div>
  </div>

  <div id="mailp" class="panel p3 glass">
    <div class="mh" id="mailHead">
      <span class="cv">&#9656;</span>
      <span class="k">Inbox</span>
      <span class="v" id="mailV">…</span>
    </div>
    <div class="mb" id="mailBody"></div>
  </div>

  <div id="sig" class="panel p2 glass">
    <div class="sig-head">
      <h2>Workstreams</h2>
      <div class="count" id="cnt">—</div>
    </div>
    <div class="sig-filter">
      <button class="chip on" id="fWork">Chats</button>
      <button class="chip" id="fNeeds">Needs you</button>
      <button class="chip" id="fAll">Everything</button>
    </div>
    <div class="sig-list" id="list"></div>
    <div class="sig-foot">
      <span id="feedState"><span class="dot idle"></span>Connecting</span>
      <span id="feedTime"></span>
    </div>
  </div>
</div>

<div id="execLayer"></div>

<div id="dw">
  <div id="dwScrim"></div>
  <div id="drawer">
    <button class="close" id="dwClose">&times;</button>
    <div class="hd">
      <div class="eyebrow" id="dEye">—</div>

  var seaTime = { value: 0 };

    sh.uniforms.uTime = seaTime;
    // The wave has to be solved in <beginnormal_vertex>, which three.js runs
    // BEFORE <begin_vertex>. Computing it later left the normal referencing an
    // undeclared variable, the shader failed to compile, and the sea rendered
    // black. Solve once here, then reuse the displacement below.
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace(
      '#include <beginnormal_vertex>',
      'float w1 = sin(position.x*0.085 + uTime*0.55) * 0.42;\n'+
      'float w2 = sin(position.y*0.062 - uTime*0.38) * 0.34;\n'+
      'float w3 = sin((position.x+position.y)*0.031 + uTime*0.22) * 0.26;\n'+
      'float disp = w1 + w2 + w3;\n'+
      'float ddx = cos(position.x*0.085 + uTime*0.55)*0.0357 + cos((position.x+position.y)*0.031 + uTime*0.22)*0.0081;\n'+
      'float ddy = cos(position.y*0.062 - uTime*0.38)*0.0211 + cos((position.x+position.y)*0.031 + uTime*0.22)*0.0081;\n'+

  /* ---------- one figure per active district ---------- */

  function badge(){
    var c=document.createElement('canvas'); c.width=128; c.height=128;
    var tex=new THREE.CanvasTexture(c);
    var s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
    s.scale.set(0.85,0.85,1); s.visible=false;
    s.userData={ctx:c.getContext('2d'),c:c,tex:tex};
    return s;
  }
  function setBadge(s,sym,col){
    if(!s) return;
    if(!sym){ s.visible=false; return; }
    if(s.userData.sym===sym){ s.visible=true; return; }
    s.userData.sym=sym; s.visible=true;
    var ctx=s.userData.ctx, c=s.userData.c;
    ctx.clearRect(0,0,c.width,c.height);
    ctx.beginPath(); ctx.arc(64,64,54,0,Math.PI*2);
    ctx.fillStyle='rgba(11,17,29,.92)'; ctx.fill();
    ctx.lineWidth=6; ctx.strokeStyle=col; ctx.stroke();
    ctx.font='800 62px "Big Shoulders Display", sans-serif';
    ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(sym,64,68);
    s.userData.tex.needsUpdate=true;
  }
  // Name plate that floats over a worker's head.
  function plate(text, col){
    var c = document.createElement('canvas'); c.width = 512; c.height = 128;
    var ctx = c.getContext('2d');
    var t = String(text||'').toUpperCase();
    var size = 50;
    ctx.font = '700 '+size+'px "IBM Plex Mono", monospace';
    while (size > 20 && ctx.measureText(t).width > 440){
      size -= 2; ctx.font = '700 '+size+'px "IBM Plex Mono", monospace';
    }
    var w = Math.min(486, ctx.measureText(t).width + 52), x0 = (512-w)/2, y0 = 34, h = 60, r = 8;
    ctx.beginPath();
    ctx.moveTo(x0+r, y0); ctx.lineTo(x0+w-r, y0); ctx.quadraticCurveTo(x0+w, y0, x0+w, y0+r);
    ctx.lineTo(x0+w, y0+h-r); ctx.quadraticCurveTo(x0+w, y0+h, x0+w-r, y0+h);
    ctx.lineTo(x0+r, y0+h); ctx.quadraticCurveTo(x0, y0+h, x0, y0+h-r);
    ctx.lineTo(x0, y0+r); ctx.quadraticCurveTo(x0, y0, x0+r, y0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(9,14,24,.88)'; ctx.fill();
    ctx.strokeStyle = 'rgba(226,211,180,.16)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = col; ctx.fillRect(x0+9, y0+16, 3, h-32);
    ctx.font = '700 '+size+'px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#f2ecdf'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t, 256 + 5, y0 + h/2 + 1);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
    sp.scale.set(4.2, 1.05, 1);
    return sp;
  }

  /* ---------- the worker ----------
     One per running thread. Built from primitives because the page cannot load
     a model file, so the read comes from silhouette and motion rather than
     polygon count: a clear head, shoulders, jointed limbs, and a lit core at
     the chest — the nuqta. Limbs hang off pivot groups so the walk cycle can
     rotate them from the shoulder and hip rather than sliding boxes around. */

  var MW = {
    shell: new THREE.MeshStandardMaterial({color:0xe6e1d4, roughness:.5,  metalness:.06, flatShading:true}),
    trim:  new THREE.MeshStandardMaterial({color:0xb99a55, roughness:.4,  metalness:.5,  flatShading:true}),
    limb:  new THREE.MeshStandardMaterial({color:0x9aa2ad, roughness:.46, metalness:.32, flatShading:true}),
    joint: new THREE.MeshStandardMaterial({color:0x3a4556, roughness:.4,  metalness:.55, flatShading:true}),
    boot:  new THREE.MeshStandardMaterial({color:0x39424f, roughness:.55, metalness:.25, flatShading:true})
  };

  function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
  function ball(r,mat){ return new THREE.Mesh(new THREE.SphereGeometry(r,10,8), mat); }

  function buildWorker(accent, surface){
    var g = new THREE.Group();
    var c = new THREE.Color(accent);
    var glow = new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:1, roughness:.28, metalness:.1});

    // Values matter more than polygons at this scale: a light body with dark
    // joints keeps the silhouette readable against both the grass and the
    // dark buildings. Legs stay short and the chest stays wide so the figure
    // reads as sturdy rather than lanky.

    // ---- legs: pivot at the hip so the whole leg swings ----
    function leg(side){
      var pivot = new THREE.Group();
      pivot.position.set(side*0.20, 0.95, 0);
      var hipCap = ball(0.14, MW.joint);
      var thigh = box(0.26, 0.42, 0.28, MW.limb);
      thigh.position.y = -0.21; thigh.castShadow = true;
      var knee = ball(0.135, MW.joint); knee.position.y = -0.42;
      var shin = box(0.23, 0.40, 0.25, MW.limb);
      shin.position.y = -0.62; shin.castShadow = true;
      var cuff = box(0.25, 0.06, 0.27, MW.joint); cuff.position.y = -0.80;
      var foot = box(0.27, 0.13, 0.42, MW.boot);
      foot.position.set(0, -0.885, 0.07); foot.castShadow = true;
      var toe = box(0.27, 0.05, 0.10, MW.trim);
      toe.position.set(0, -0.925, 0.24);
      pivot.add(hipCap, thigh, knee, shin, cuff, foot, toe);
      return pivot;
    }
    var legL = leg(-1), legR = leg(1);

    var hips = box(0.60, 0.24, 0.38, MW.joint);
    hips.position.y = 0.99; hips.castShadow = true;
    var belt = box(0.62, 0.06, 0.40, MW.trim);
    belt.position.y = 1.10;

    // ---- torso ----
    var torso = new THREE.Group();
    torso.position.y = 1.05;
    var chest = box(0.72, 0.56, 0.44, MW.shell);
    chest.position.y = 0.30; chest.castShadow = true;
    var chestPlate = box(0.50, 0.40, 0.05, MW.shell);
    chestPlate.position.set(0, 0.32, 0.235);
    var chestEdge = box(0.54, 0.03, 0.05, MW.trim);
    chestEdge.position.set(0, 0.115, 0.238);
    // the nuqta: one lit dot at the centre of the chest, in a brass bezel
    var bezel = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.045, 16), MW.trim);
    bezel.rotation.x = Math.PI/2; bezel.position.set(0, 0.34, 0.245);
    var core = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.06, 16), glow);
    core.rotation.x = Math.PI/2; core.position.set(0, 0.34, 0.255);
    var collar = box(0.56, 0.11, 0.36, MW.joint);
    collar.position.y = 0.615;
    torso.add(chest, chestPlate, chestEdge, bezel, core, collar);

    // ---- arms: pivot at the shoulder ----
    function arm(side){
      var pivot = new THREE.Group();
      pivot.position.set(side*0.45, 0.52, 0);
      var pauldron = ball(0.185, MW.shell); pauldron.castShadow = true;
      var capTrim = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.15,0.05,12), MW.trim);
      capTrim.position.y = -0.12;
      var upper = box(0.18, 0.34, 0.20, MW.limb);
      upper.position.y = -0.20; upper.castShadow = true;
      var elbow = ball(0.105, MW.joint); elbow.position.y = -0.38;
      var fore = box(0.16, 0.32, 0.18, MW.limb);
      fore.position.y = -0.56; fore.castShadow = true;
      var hand = box(0.15, 0.16, 0.16, MW.joint); hand.position.y = -0.78;
      pivot.add(pauldron, capTrim, upper, elbow, fore, hand);
      return pivot;
    }
    var armL = arm(-1), armR = arm(1);
    torso.add(armL, armR);

    // ---- head ----
    var head = new THREE.Group();
    head.position.y = 0.72;
    var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.12,0.10,8), MW.joint);
    neck.position.y = -0.02;
    var skull = box(0.46, 0.38, 0.44, MW.shell);
    skull.position.y = 0.22; skull.castShadow = true;
    var crownPad = box(0.42, 0.05, 0.40, MW.joint);
    crownPad.position.y = 0.415;
    var crown = box(0.16, 0.035, 0.30, MW.trim);   // a stripe, not a hard hat
    crown.position.y = 0.443;
    var jaw = box(0.40, 0.08, 0.40, MW.joint);
    jaw.position.y = 0.035;
    // the visor wraps the front and both cheeks so it reads from any angle
    var visor = box(0.36, 0.12, 0.03, glow);
    visor.position.set(0, 0.22, 0.225);
    var visorL = box(0.03, 0.10, 0.17, glow); visorL.position.set(-0.228, 0.22, 0.07);
    var visorR = box(0.03, 0.10, 0.17, glow); visorR.position.set( 0.228, 0.22, 0.07);
    var ant = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.022,0.24,6), MW.joint);
    ant.position.set(0.13, 0.55, -0.07);
    var antTip = ball(0.05, glow); antTip.position.set(0.13, 0.68, -0.07);
    head.add(neck, skull, crownPad, crown, jaw, visor, visorL, visorR, ant, antTip);
    torso.add(head);

    // ---- a Claude Code thread carries a terminal on its back ----
    if (surface === 'code'){
      var pack = new THREE.Group();
      var caseM = box(0.44, 0.44, 0.14, MW.joint);
      var rim = box(0.46, 0.05, 0.15, MW.trim); rim.position.y = 0.22;
      var scr = box(0.32, 0.30, 0.02, glow); scr.position.z = -0.08;
      pack.add(caseM, rim, scr);
      pack.position.set(0, 0.30, -0.28);
      pack.rotation.y = Math.PI;
      pack.castShadow = true;
      torso.add(pack);
    }

    g.add(legL, legR, hips, belt, torso);
    return {
      group: g, torso: torso, head: head,
      legL: legL, legR: legR, armL: armL, armR: armR,
      glow: glow
    };
  }

  /* ---------- one worker per chat ---------- */

  var workerGroup = new THREE.Group(); root.add(workerGroup);
  var workers = [];

  function workerStatus(w){
    if (w.status === 'blocked') return {col:0xe8b23d, stuck:true,  ready:false};
    if (w.status === 'review')  return {col:0x7fbf7a, stuck:false, ready:true};
    if (w.touched && daysAgo(w.touched) >= WORK_STALE) return {col:0xe8b23d, stuck:true, ready:false};
    return {col:null, stuck:false, ready:false};
  }

  function renderWorkers(){
    while (workerGroup.children.length) workerGroup.remove(workerGroup.children[0]);
    workers = [];

    GROUPS.forEach(function(gp){
      var mine = works.filter(function(w){
        return w.co === gp.id && w.status !== 'shipped' && w.status !== 'parked';
      });
      if (!mine.length) return;

      var d = district(gp.id);
      var origin = d ? d.pos : new THREE.Vector3(CITY.x, 0, CITY.z);
      var ang = d ? d.angle : 0;
      var out  = new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang));
      var side = new THREE.Vector3(-out.z, 0, out.x);
      var accent = d ? d.accent : 0xc49a3c;

      mine.forEach(function(w, i){
        var st = workerStatus(w);
        var col = st.col || accent;
        var rig = buildWorker(col, w.surface);

        // The workers are the subject, so they run a little larger than strict
        // scale against the buildings. The holder carries the label and the hit
        // box at true size while only the body is scaled.
        var holder = new THREE.Group();
        rig.group.scale.setScalar(1.3);
        holder.add(rig.group);

        // a soft disc anchors the figure to the ground on flat, bright plaza
        var pad = new THREE.Mesh(new THREE.CircleGeometry(0.62, 20),
          new THREE.MeshBasicMaterial({color:0x0b111d, transparent:true, opacity:0.16, depthWrite:false}));
        pad.rotation.x = -Math.PI/2; pad.position.y = 0.02;
        holder.add(pad);

        var np = plate(w.name, gp.css);
        np.position.set(0, 3.85, 0);
        holder.add(np);

        var hit = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.2, 1.5),
          new THREE.MeshBasicMaterial({visible:false}));
        hit.position.y = 1.6;
        hit.userData.workId = 'work-' + w.id;
        holder.add(hit);

        // lanes run outward from the building; the row offset staggers them
        // sideways too so neighbouring labels do not sit on top of each other
        var laneN = i % 4, rowN = Math.floor(i / 4);
        var lane = out.clone().multiplyScalar(6.6 + laneN * 2.9);
        var span = 3.3 + rowN * 0.7;
        var skew = side.clone().multiplyScalar(laneN * 0.55 - 0.8);
        var p0 = origin.clone().add(lane).add(skew).add(side.clone().multiplyScalar(-span));
        var p1 = origin.clone().add(lane).add(skew).add(side.clone().multiplyScalar( span));

        holder.position.copy(p0);
        workerGroup.add(holder);
        workers.push({
          obj: holder, rig: rig, hit: hit, p0: p0, p1: p1, plate: np,
          ph: (i * 2.11) % 6.28, sp: 0.24 + (i % 5) * 0.05,
          stuck: st.stuck, ready: st.ready, id: 'work-' + w.id
        });
      });
    });
  }

  var dealGroup = new THREE.Group(); root.add(dealGroup);
  function renderDealPillars(){
    while(dealGroup.children.length) dealGroup.remove(dealGroup.children[0]);
    var d = district('al');
    var open = deals.filter(function(x){ var s=STAGES[x.stage]; return !(s && s.closed); });
    open.forEach(function(dl,i){
      var s = STAGES[dl.stage] || {step:1};
      var prog = Math.max(0.16, (s.step||1)/STAGE_MAX);
      var stale = daysAgo(dl.modified) >= STALE_DAYS;
      var col = stale ? 0xe8b23d : 0x4f8fc0;
      var h = 1.2 + prog*4.2;
      var col2 = new THREE.Color(col);
      var pill = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,h,10),
        new THREE.MeshStandardMaterial({color:col2, emissive:col2, emissiveIntensity:.55, roughness:.4}));
      pill.castShadow = true;
      var cols = 4;
      pill.position.set(d.pos.x - 3.6 + (i%cols)*2.1, h/2, d.pos.z - 6.6 - Math.floor(i/cols)*2.1);
      dealGroup.add(pill);
      var base = new THREE.Mesh(new THREE.CylinderGeometry(0.66,0.66,0.16,10), M.concrete);
      base.position.set(pill.position.x, 0.08, pill.position.z);
      base.receiveShadow = true;
      dealGroup.add(base);
    });
  }

  /* ---------- day / night ---------- */

  var CYCLE = 150, phase = 0.30, nightAmt = 0;
  function cycle(dt){
    phase += dt/CYCLE; if (phase>1) phase-=1;
    var ang = phase*Math.PI*2 - Math.PI/2;
    var sy = Math.sin(ang), sx = Math.cos(ang);
    sun.position.set(sx*80, Math.max(sy,0.05)*80+10, 30);
    sun.target.position.copy(camT);
    var day = THREE.MathUtils.clamp(sy*1.4+0.15, 0, 1);
    sun.intensity = 0.14 + day*1.16;
    var top,bot,fog;
    if (sy > 0.18){ top=0x2f6ea8; bot=0xf6c98c; fog=0xf3cb9b; }
    else if (sy > -0.15){ top=0x2b3b66; bot=0xe07a4f; fog=0xdd8a63; }
    else { top=0x050813; bot=0x18203c; fog=0x0a0f1c; }
    skyU.topColor.value.lerp(new THREE.Color(top), .04);
    skyU.bottomColor.value.lerp(new THREE.Color(bot), .04);
    scene.fog.color.lerp(new THREE.Color(fog), .04);
    hemi.intensity = 0.22 + day*0.55;
    var night = 1-day; nightAmt = night;
    nightFill.intensity = night*1.7;
    lamps.forEach(function(b){ b.material.emissiveIntensity = night*1.4; });
    windowLights.forEach(function(w){ w.material.emissiveIntensity = night*0.85; });
    // the city lights up window by window
    windowMats.forEach(function(m){ m.emissiveIntensity = night*1.15; });
    signMats.forEach(function(m){ m.emissiveIntensity = 0.6 + night*0.7; });
    wheelCabs.forEach(function(c){ c.material.emissiveIntensity = night*1.5; });
    dot.material.emissiveIntensity = 0.4 + night*0.7;
    var aaw = district('aaw');
    if (aaw.doorMat) aaw.doorMat.emissiveIntensity = 0;  // dormant: lights stay off
  }

  /* ---------- animation ---------- */

  var clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    cycle(dt);

    seaTime.value = t;
    // the surf line breathes up and down the sand
    foam.position.x = -28.4 + Math.sin(t*0.42)*1.5;
    foamMat.opacity = 0.34 + Math.sin(t*0.42 + 1.2)*0.14;

    swayers.forEach(function(sw){
      sw.obj.rotation.z = Math.sin(t*0.62 + sw.ph)*sw.amt;
      sw.obj.rotation.x = Math.cos(t*0.48 + sw.ph*1.7)*sw.amt*0.6;
    });

    gulls.forEach(function(gl){
      var a = t*gl.sp + gl.ph;
      gl.obj.position.set(gl.cx + Math.cos(a)*gl.r, gl.y + Math.sin(a*1.7)*1.6, gl.cz + Math.sin(a)*gl.r);
      gl.obj.rotation.y = -a + Math.PI/2;
      gl.obj.rotation.z = 0.3;
      var flap = Math.sin(t*7 + gl.ph)*0.5;
      gl.wL.rotation.z =  flap; gl.wR.rotation.z = -flap;
    });

    if (ferris) ferris.rotation.z += 0.004;
    if (holo){ holo.rotation.y += 0.012; holo.position.y = 6.6 + Math.sin(t*1.2)*0.14; }

    cars.forEach(function(c){
      c.t += c.sp*dt;
      var a = c.t*Math.PI*2;
      c.obj.position.set(CITY.x+Math.cos(a)*c.lane, 0.36, CITY.z+Math.sin(a)*c.lane);
      c.obj.rotation.y = -a + (c.sp>0 ? Math.PI/2 : -Math.PI/2);
    });

    workers.forEach(function(w){
      var r = w.rig;
      if (w.stuck){
        // stuck threads stop walking. The stillness is the signal; the pulse
        // and a slow look-around keep them from reading as dead geometry.
        w.obj.position.copy(w.p0).lerp(w.p1, 0.5);
        var idle = Math.sin(t*1.4 + w.ph);
        r.legL.rotation.x = 0; r.legR.rotation.x = 0;
        r.armL.rotation.x = 0.06; r.armR.rotation.x = 0.06;
        r.armL.rotation.z =  0.16; r.armR.rotation.z = -0.16;
        r.torso.position.y = 1.05 + idle*0.012;
        r.torso.rotation.x = 0;
        r.head.rotation.y = Math.sin(t*0.5 + w.ph)*0.5;
        r.head.rotation.z = idle*0.03;
        r.glow.emissiveIntensity = 0.55 + Math.sin(t*3 + w.ph)*0.45;
      } else {
        var cyc = t*w.sp*2.6 + w.ph;          // one stride per half cycle
        var u = (Math.sin(t*w.sp + w.ph) + 1)/2;
        w.obj.position.lerpVectors(w.p0, w.p1, u);

        var swing = Math.sin(cyc);
        r.legL.rotation.x =  swing*0.62;
        r.legR.rotation.x = -swing*0.62;
        r.armL.rotation.x = -swing*0.44;      // arms oppose the legs
        r.armR.rotation.x =  swing*0.44;
        r.armL.rotation.z =  0.13;
        r.armR.rotation.z = -0.13;
        // the body rises twice per stride, at each mid-step
        r.torso.position.y = 1.05 + Math.abs(Math.cos(cyc))*0.045;
        r.torso.rotation.x = 0.05;            // a walker leans in
        r.torso.rotation.y = swing*0.07;      // shoulders counter the hips
        r.head.rotation.y = -swing*0.06;
        r.head.rotation.z = 0;

        w.obj.rotation.y = Math.atan2(w.p1.x-w.p0.x, w.p1.z-w.p0.z) +
                           (Math.cos(t*w.sp + w.ph) < 0 ? Math.PI : 0);
        r.glow.emissiveIntensity = w.ready
          ? 0.85 + Math.sin(t*2 + w.ph)*0.35
          : 0.8 + Math.sin(t*1.2 + w.ph)*0.14;
      }
      w.plate.material.opacity = ZOOM.cur < 32 ? 1 : Math.max(0, 1 - (ZOOM.cur-32)/16);
      w.plate.visible = w.plate.material.opacity > 0.04;
    });

    keyPan(dt); glide();
    camT.lerp(camG,0.16);      // was 0.08, which read as lag on every drag
    ZOOM.cur += (ZOOM.tgt-ZOOM.cur)*0.08;
    var da = azG-az; while(da>Math.PI)da-=6.283185; while(da<-Math.PI)da+=6.283185;
    az += da*0.1;
    camFrustum(); camPos(); positionExec();
    drawPost(nightAmt);
  }

  /* ---------- camera interaction ---------- */

  /* ==================== navigation ====================
     The camera sits at target + D*(cos az, ., sin az), so the vector that runs
     left-to-right across the screen along the ground is (sin az, 0, -cos az).
     The old code used (cos az, 0, -sin az) — sin and cos transposed. At the
     default heading sin equals cos so it happened to work; rotate ninety
     degrees and it is exactly inverted, which is why dragging fought back.
     Vertical drags also need dividing by sin(ISO): a metre of ground travelling
     away from an isometric camera only covers 0.58 of a metre on screen, so
     without it the world lags behind the cursor on every vertical drag. */

  var SIN_ISO = Math.sin(ISO);
  var el = renderer.domElement;
  var _r = new THREE.Vector3(), _f = new THREE.Vector3();

  function screenRight(a){ return _r.set(Math.sin(a), 0, -Math.cos(a)); }
  function screenUpGround(a){ return _f.set(-Math.cos(a), 0, -Math.sin(a)); }

  // world units per screen pixel, vertically
  function unitsPerPx(){ return (2*ZOOM.cur)/window.innerHeight; }

  function panBy(dx, dy){
    var sc = unitsPerPx();
    camG.addScaledVector(screenRight(az), -dx*sc);
    camG.addScaledVector(screenUpGround(az), -dy*sc/SIN_ISO);
    clampPan();
  }
  function clampPan(){
    // keep the basin reachable without letting the camera wander into the void
    var ox = camG.x - CITY.x, oz = camG.z - CITY.z;
    var len = Math.sqrt(ox*ox + oz*oz), max = 62;
    if (len > max){ camG.x = CITY.x + ox*max/len; camG.z = CITY.z + oz*max/len; }
  }

  // Zooming pins the point under the cursor instead of the screen centre, so
  // you can put the pointer on a district and zoom straight into it.
  function zoomAt(delta, cx, cy){
    var z0 = ZOOM.tgt;
    var z1 = THREE.MathUtils.clamp(z0 + delta, ZOOM.min, ZOOM.max);
    if (z1 === z0) return;
    ZOOM.tgt = z1;
    if (cx == null) return;
    var aspect = window.innerWidth/window.innerHeight;
    var nx =  (cx/window.innerWidth)*2 - 1;
    var ny = -((cy/window.innerHeight)*2 - 1);
    var k = z0 - z1;
    camG.addScaledVector(screenRight(az), nx*aspect*k);
    camG.addScaledVector(screenUpGround(az), ny*k/SIN_ISO);
    clampPan();
  }

  var drag = false, rotating = false, lx = 0, ly = 0;
  var vx = 0, vy = 0;               // pan momentum, so a flick keeps gliding

  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  el.addEventListener('pointerdown', function(e){
    lx = e.clientX; ly = e.clientY; vx = vy = 0;
    rotating = (e.button === 2 || e.button === 1 || e.shiftKey);
    drag = !rotating;
    mount.classList.add('dragging');
    if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch(_){} }
  });
  window.addEventListener('pointerup', function(){
    drag = false; rotating = false; mount.classList.remove('dragging');
  });
  window.addEventListener('pointermove', function(e){
    if (!drag && !rotating) return;
    var dx = e.clientX-lx, dy = e.clientY-ly; lx = e.clientX; ly = e.clientY;
    if (rotating){
      azG += dx*0.007; needle();
    } else {
      panBy(dx, dy);
      vx = dx; vy = dy;
    }
  });

  /* Trackpads send a plain wheel event for a two-finger scroll and a
     ctrl-modified one for a pinch. Treating every wheel as zoom made scrolling
     on a laptop lurch in and out, so scroll pans and pinch zooms. A mouse wheel
     still zooms: its deltas arrive in coarse steps, which is the tell. */
  el.addEventListener('wheel', function(e){
    e.preventDefault();
    if (e.ctrlKey){                                   // pinch
      zoomAt(e.deltaY*0.09, e.clientX, e.clientY);
    } else if (e.deltaMode === 0 && Math.abs(e.deltaY) < 50 && Math.abs(e.deltaX) > 0.01){
      panBy(-e.deltaX, -e.deltaY);                    // two-finger scroll
    } else if (e.deltaMode !== 0 || Math.abs(e.deltaY) >= 50){
      zoomAt(e.deltaY*0.035, e.clientX, e.clientY);   // mouse wheel notch
    } else {
      panBy(-e.deltaX, -e.deltaY);
    }
  }, {passive:false});

  // Keyboard, for anyone who would rather not drag at all.
  var keys = {};
  window.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'q' || e.key === 'Q'){ azG -= Math.PI/2; needle(); }
    if (e.key === 'e' || e.key === 'E'){ azG += Math.PI/2; needle(); }
    if (e.key === '=' || e.key === '+') zoomAt(-6);
    if (e.key === '-' || e.key === '_') zoomAt(6);
    if (e.key === 'f' || e.key === 'F' || e.key === 'Home') resetView();
    if (e.key === 'Escape') closeDrawer();
  });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

  function resetView(){
    camG.set(2,0,8); ZOOM.tgt = 34; azG = Math.PI*1.25; needle();
  }

  function keyPan(dt){
    var k = 620*dt;                       // pixels per second, feel-matched to a drag
    var dx = 0, dy = 0;
    if (keys.a || keys.arrowleft)  dx += k;
    if (keys.d || keys.arrowright) dx -= k;
    if (keys.w || keys.arrowup)    dy += k;
    if (keys.s || keys.arrowdown)  dy -= k;
    if (dx || dy) panBy(dx, dy);
  }

  function glide(){
    if (drag || rotating) return;
    if (Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) { vx = vy = 0; return; }
    panBy(vx*0.3, vy*0.3);
    vx *= 0.86; vy *= 0.86;
  }

  document.getElementById('zin').onclick  = function(){ zoomAt(-6); };
  document.getElementById('zout').onclick = function(){ zoomAt(6); };
  document.getElementById('rotL').onclick = function(){ azG-=Math.PI/2; needle(); };
  document.getElementById('rotR').onclick = function(){ azG+=Math.PI/2; needle(); };
  function needle(){
    document.getElementById('needle').style.transform =
      'translate(-50%,-100%) rotate('+((azG*180/Math.PI)%360)+'deg)';
  }
  window.addEventListener('resize',function(){
    renderer.setSize(innerWidth,innerHeight); camFrustum(); sizePost();
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  sizePost();
  camFrustum(); camPos(); needle();

  // Clicking a worker opens that thread. A drag is not a click.
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var downAt = null;
  el.addEventListener('pointerdown', function(e){
    downAt = (e.button === 0 && !e.shiftKey) ? {x:e.clientX, y:e.clientY} : null;
  });
  el.addEventListener('pointerup', function(e){
    if (!downAt || e.button !== 0) return;
    var moved = Math.abs(e.clientX-downAt.x) + Math.abs(e.clientY-downAt.y);
    downAt = null;
    if (moved > 5) return;
    ndc.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(workers.map(function(w){ return w.hit; }), false);
    if (hits.length) openDrawer(hits[0].object.userData.workId);
  });
  el.addEventListener('pointermove', function(e){
    if (drag || rotating) return;
    ndc.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var over = ray.intersectObjects(workers.map(function(w){ return w.hit; }), false).length > 0;
    el.style.cursor = over ? 'pointer' : '';
  });

  function focusDistrict(d){
    if (execOn) setExec(false);
    camG.set(CITY.x + (d.pos.x-CITY.x)*0.55, 0, CITY.z + (d.pos.z-CITY.z)*0.55);
    ZOOM.tgt = 17;
  }

  /* ==================== HubSpot feed ==================== */

  function parseDeals(payload){
    var p = payload;
    if (typeof p === 'string'){ try { p = JSON.parse(p); } catch(e){ return null; } }
    if (!p) return null;
    var rows = p.results || p.items || (Array.isArray(p) ? p : null);
    if (!rows) return null;
    var tpl = p.urlTemplate || '';
    return rows.map(function(r){
      var pr = r.properties || r;
      var mod = Date.parse(pr.hs_lastmodifieddate || pr.createdate || '') || Date.now();
      return {
        id: r.id || pr.hs_object_id,
        name: pr.dealname || r.displayName || 'Untitled deal',
        stage: pr.dealstage || '',
        amount: pr.amount ? Number(pr.amount) : null,
        currency: pr.deal_currency_code || 'USD',
        closedate: pr.closedate || null,
        created: Date.parse(pr.createdate||'') || null,
        modified: mod,
        url: tpl ? tpl.replace('{id}', r.id || pr.hs_object_id) : null
      };
    });
  }

  var FEED_COPY = {
    needs_reauth:        {t:'HubSpot needs reconnecting', b:'Reconnect HubSpot in claude.ai Settings → Connectors to bring the pipeline back.'},
    server_not_connected:{t:'HubSpot not connected here', b:'Add HubSpot in claude.ai Settings → Connectors, then reload this page.'},
    selection_required:  {t:'Choose a HubSpot account',   b:'More than one HubSpot connector is available. Pick one when prompted, then reload.'},
    not_in_manifest:     {t:'HubSpot is off for this page', b:'The connector was declined or switched off for this artifact. Re-enable it to see live deals.'},
    blocked_by_policy:   {t:'Blocked by policy',          b:'Your organisation blocks this HubSpot tool. The tracked items below still work.'},
    approval_required:   {t:'Needs approval',             b:'This HubSpot call requires per-call approval, which artifacts cannot request yet.'},
    tool_error:          {t:'HubSpot returned an error',  b:'The connector answered but reported a failure. The tracked items below are unaffected.'},
    server_unavailable:  {t:'HubSpot unreachable',        b:'Showing the last data received. It will refresh on its own.'},
    upstream_error:      {t:'HubSpot call failed',        b:'Showing the last data received. It will refresh on its own.'}
  };
  var RETRACTING = {needs_reauth:1, server_not_connected:1, not_in_manifest:1, blocked_by_policy:1, approval_required:1, selection_required:1};

  function startFeed(){
    if (typeof claude === 'undefined' || !claude.use){
      feed = {state:'nomcp'}; render(); return;
    }
    claude.use('mcp').then(function(mcp){
      if (!mcp){ feed = {state:'nomcp'}; render(); return; }
      var input = {
        objectType:'DEAL',
        properties:['dealname','dealstage','amount','deal_currency_code','closedate','hs_lastmodifieddate','createdate'],
        limit:100,
        chatInsights:{userIntent:'Show the live sales pipeline on a personal operations dashboard', satisfaction:'NEUTRAL'}
      };
      mcp.watchTool('HubSpot','search_crm_objects', input, function(ev){
        if (ev.type === 'data'){
          var parsed = parseDeals(ev.result && ev.result.payload);
          if (parsed){
            deals = parsed;
            feed = {state:'ok', storedAt: (ev.result.cache && ev.result.cache.storedAt) || Date.now(),
                    cached: !!(ev.result.cache)};
            renderDealPillars();
          } else {
            feed = {state:'error', code:'tool_error'};
          }
        } else {
          var code = (ev.error && ev.error.code) || 'upstream_error';
          if (RETRACTING[code]){ deals = []; renderDealPillars(); }
          feed = {state:'error', code:code};
        }
        render();
      }, {refetchInterval: 300000});
    }).catch(function(){ feed = {state:'nomcp'}; render(); });
  }

  /* ---------- Outlook ----------
     This connector answers with one text block per message rather than a
     single JSON array, so read result.content and parse each block. The
     last block is a pagination summary and carries no id. */
  function parseMail(result){
    var rows = [];
    var blocks = (result && result.content) || [];
    var summary = null;
    blocks.forEach(function(b){
      if (!b || b.type !== 'text' || !b.text) return;
      var o; try { o = JSON.parse(b.text); } catch(e){ return; }
      if (o && o.id && o.receivedDateTime) rows.push(o);
      else if (o && (o.totalResultCount != null || o.moreResults != null)) summary = o;
    });
    if (!rows.length && result && Array.isArray(result.payload)) rows = result.payload;
    var human = [], vendor = [];
    rows.forEach(function(r){
      var addr = (r.sender || '').toLowerCase();
      var rec = {
        id: (r.id || r.internetMessageId || Math.random()).toString().slice(-24),
        subject: r.subject,
        from: addr,
        fromName: addr.split('@')[0] + '@' + (addr.split('@')[1] || ''),
        at: Date.parse(r.receivedDateTime) || Date.now(),
        unread: r.isRead === false,
        snippet: (r.summary || '').replace(/[͏​\r\n\s]+/g, ' ').trim().slice(0, 260),
        link: r.webLink || null
      };
      (isVendor(addr) ? vendor : human).push(rec);
    });
    return {human:human, vendor:vendor,
            total: (summary && summary.totalResultCount) || rows.length};
  }

  function startMailFeed(){
    if (typeof claude === 'undefined' || !claude.use) { mailFeed = {state:'nomcp'}; return; }
    claude.use('mcp').then(function(mcp){
      if (!mcp){ mailFeed = {state:'nomcp'}; render(); return; }
      mcp.watchTool('Microsoft 365','outlook_email_search',
        {folderName:'Inbox', order:'newest', limit:25},
        function(ev){
          if (ev.type === 'data'){
            mail = parseMail(ev.result);
            mailFeed = {state:'ok',
              storedAt:(ev.result.cache && ev.result.cache.storedAt) || Date.now(),
              cached: !!(ev.result.cache)};
          } else {
            var code = (ev.error && ev.error.code) || 'upstream_error';
            if (RETRACTING[code]) mail = {human:[], vendor:[], total:0};
            mailFeed = {state:'error', code:code};
          }
          render();
        }, {refetchInterval: 300000});
    }).catch(function(){ mailFeed = {state:'nomcp'}; render(); });
  }

  /* ==================== persistence ==================== */

  function initDb(){
    if (typeof claude === 'undefined' || !claude.use) return;
    claude.use('db').then(function(h){
      if (!h) return;
      db = h;
      var ref = db.doc('workspace/milestones');
      ref.get().then(function(s){
        if (s.exists && s.data() && s.data().done){ doneMap = s.data().done; render(); }
      }).catch(function(){});
      ref.onSnapshot(function(s){
        if (s.exists && s.data() && s.data().done){ doneMap = s.data().done; render(); }
      }, function(){});
      msRef = ref;

      // Workstreams live one doc per thread so any conversation can add or edit
      // a single thread without rewriting the whole board.
      // A one-shot get() runs alongside the subscription: if live updates are
      // unavailable the board still fills in, and any failure is shown, not swallowed.
      var col;
      try { col = db.collection('workstreams'); }
      catch (e){ workErr('bad collection path: ' + (e && e.message)); return; }
      worksCol = col;

      function absorb(snap){
        var next = [];
        (snap && snap.docs ? snap.docs : []).forEach(function(doc){
          var v = doc.data() || {};
          next.push({
            id: doc.id,
            name: v.name || doc.id,
            co: v.co || 'av',
            status: WORK_STATUS[v.status] ? v.status : 'active',
            note: v.note || '',
            link: v.link || '',
            surface: v.surface || 'chat',
            home: v.home || '',
            touched: v.touched || null
          });
        });
        works = next; worksLoaded = true;
        worksFeed = {state:'ok', msg:''};
        render(); renderWorkers();
      }

      col.get().then(absorb).catch(function(e){
        workErr('read failed: ' + ((e && (e.code || e.message)) || 'unknown'));
      });
      try {
        col.onSnapshot(absorb, function(e){
          // a live-update failure is not fatal if get() already filled the board
          if (!worksLoaded) workErr('live updates failed: ' + ((e && (e.code || e.message)) || 'unknown'));
        });
      } catch (e){ /* get() is the fallback */ }
    }).catch(function(e){
      workErr('store unavailable: ' + ((e && (e.code || e.message)) || 'unknown'));
    });
  }

  function workErr(msg){
    if (window.console && console.error) console.error('[nuqta] workstreams — ' + msg);
    worksLoaded = true;
    worksFeed = {state:'error', msg:msg};
    render();
  }

  function writeWork(id, patch){
    var w = works.filter(function(x){ return x.id === id; })[0];
    if (w) { for (var k in patch) w[k] = patch[k]; }   // optimistic, snapshot corrects
    render(); renderWorkers();
    if (worksCol) worksCol.doc(id).update(patch).catch(function(e){
      workErr('write failed: ' + ((e && (e.code || e.message)) || 'unknown'));
    });
  }
  function touchWork(id){ writeWork(id, {touched: Date.now()}); }
  function setWorkStatus(id, st){
    var patch = {status: st};
    if (st !== 'shipped' && st !== 'parked') patch.touched = Date.now();
    writeWork(id, patch);
  }
  function saveMilestones(){
    if (msRef) msRef.set({done:doneMap, updatedAt:Date.now()}).catch(function(){});
  }
  function toggleMilestone(id){
    if (doneMap[id]) delete doneMap[id]; else doneMap[id] = Date.now();
    saveMilestones(); render();
  }

  /* ==================== rendering ==================== */

  var listEl = document.getElementById('list');

  function render(){
    renderClocks();
    renderList();
    renderMail();
    renderFoot();
    renderExec();
    if (activeId) renderDrawer();
  }

  function renderClocks(){
    var g = daysBetween(new Date(), GATE_DATE);
    var w = daysBetween(new Date(), WEDDING);
    var gEl = document.getElementById('gateN'), wEl = document.getElementById('wedN');
    gEl.textContent = g < 0 ? '—' : g;
    gEl.classList.toggle('warn', g <= 45);
    wEl.textContent = w < 0 ? '—' : w;
  }

  function renderList(){
    var all = signals();
    var shown = filterMode === 'needs' ? all.filter(function(s){ return s.needs; })
              : filterMode === 'work'  ? all.filter(function(s){ return s.kind === 'work'; })
              : all;
    var nc = filterMode === 'work'
      ? all.filter(function(x){ return x.kind === 'work' && x.needs; }).length
      : needsCount();
    document.getElementById('cnt').textContent = nc ? nc+' need you' : 'All clear';
    document.getElementById('cnt').classList.toggle('warn', nc>0);

    var html = '';
    if (feed.state === 'error' && FEED_COPY[feed.code]){
      var c = FEED_COPY[feed.code];
      html += '<div class="notice'+(RETRACTING[feed.code]?' bad':'')+'"><h4>HubSpot — '+c.t+'</h4><p>'+c.b+'</p></div>';
    }
    if (worksFeed.state === 'error'){
      html += '<div class="notice bad"><h4>Workstream board did not load</h4>'+
              '<p>'+esc(worksFeed.msg)+'</p></div>';
    }
    if (feed.state === 'nomcp'){
      html += '<div class="notice"><h4>Live deal feed unavailable here</h4>'+
              '<p>Open this page inside Claude with the HubSpot connector on to see deals. Workstreams and tracked items below work either way.</p></div>';
    }

    GROUPS.forEach(function(d){
      var rows = shown.filter(function(s){ return s.dist === d.id; });
      if (!rows.length && (filterMode !== 'all' || d.virtual)) return;
      var KO = {work:0, deal:1, milestone:2};
      rows = rows.slice().sort(function(a,b){
        if (KO[a.kind] !== KO[b.kind]) return KO[a.kind] - KO[b.kind];
        if (a.kind === 'work'){
          var oa = WORK_RANK.indexOf(a.work.status), ob = WORK_RANK.indexOf(b.work.status);
          if (oa !== ob) return oa - ob;
          return (b.work.touched||0) - (a.work.touched||0);
        }
        return 0;
      });
      html += '<div class="grp" style="--accent:'+d.css+'">';
      html += '<div class="grp-head" data-focus="'+d.id+'">'+
                '<span class="tag">'+d.tag+'</span>'+
                '<span class="nm">'+d.name+'</span>'+
                '<span class="src '+d.feed+'">'+(d.feed==='live'?'Live':d.feed==='dormant'?'Dormant':'Tracked')+'</span>'+
              '</div>';
      // Finished and parked work folds away, otherwise the board silts up and
      // stops being something you can read at a glance.
      function settled(s){
        return s.kind === 'work' && (s.work.status === 'shipped' || s.work.status === 'parked');
      }
      var live = rows.filter(function(s){ return !settled(s); });
      var rest = rows.filter(settled);

      if (!live.length && !rest.length){
        html += '<div class="empty" style="padding:8px 10px;font-size:11.5px;">Nothing open.</div>';
      }
      function rowHtml(s){
        var jump = (s.kind === 'work' && s.work.link)
          ? '<button class="jump" data-open="'+esc(s.work.link)+'" title="Open it">&#8599;</button>' : '';
        return '<div class="row'+(s.needs?' needs':'')+(s.done?' done':'')+(activeId===s.id?' active':'')+
               '" style="--accent:'+d.css+'" data-id="'+s.id+'">'+
               '<div class="tick">'+(s.done?'✓':'')+'</div>'+
               '<div class="bd"><div class="t1"><div class="ttl">'+esc(s.title)+'</div>'+
               '<div class="st'+(s.needs?' warn':(s.done?' ok':''))+'">'+s.status+'</div></div>'+
               '<div class="meta">'+esc(s.meta)+'</div></div>'+ jump +'</div>';
      }
      live.forEach(function(s){ html += rowHtml(s); });
      if (rest.length){
        var shipped = rest.filter(function(s){ return s.work.status === 'shipped'; }).length;
        var parked  = rest.length - shipped;
        var bits = [];
        if (shipped) bits.push(shipped + ' shipped');
        if (parked)  bits.push(parked + ' parked');
        html += '<div class="arch'+(archOpen[d.id]?' open':'')+'" data-arch="'+d.id+'">'+
                '<span class="cv">&#9656;</span>' + bits.join(' · ') + '</div>';
        if (archOpen[d.id]) rest.forEach(function(s){ html += rowHtml(s); });
      }
      html += '</div>';
    });

    if (!shown.length && filterMode === 'needs') html += '<div class="empty">Nothing waiting on you.</div>';
    if (!shown.length && filterMode === 'work')
      html += '<div class="empty">No chats on the board yet. Tell me in any conversation to add one and it appears here and in the world.</div>';
    listEl.innerHTML = html;

    Array.prototype.forEach.call(listEl.querySelectorAll('.row'), function(r){
      r.addEventListener('click', function(){ openDrawer(r.getAttribute('data-id')); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.jump'), function(j){
      j.addEventListener('click', function(ev){
        ev.stopPropagation();          // the arrow goes to the thread, not the drawer
        window.open(j.getAttribute('data-open'), '_blank', 'noopener');
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.arch'), function(a){
      a.addEventListener('click', function(){
        var k = a.getAttribute('data-arch');
        archOpen[k] = !archOpen[k]; renderList();
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.grp-head'), function(g){
      g.addEventListener('click', function(){
        var dd = district(g.getAttribute('data-focus'));
        if (dd) focusDistrict(dd);   // Anwar Ventures is a group, not a place on the map
      });
    });
  }

  function renderFoot(){
    var s = document.getElementById('feedState'), t = document.getElementById('feedTime');
    function bit(f, okText){
      if (f.state === 'ok')    return '<span class="dot"></span>' + okText;
      if (f.state === 'error') return '<span class="dot bad"></span>offline';
      if (f.state === 'nomcp') return '<span class="dot idle"></span>off';
      return '<span class="dot idle"></span>…';
    }
    var live = works.filter(function(w){ return w.status==='active'||w.status==='blocked'||w.status==='review'; }).length;
    s.innerHTML =
      '<span><span class="dot'+(worksLoaded?'':' idle')+'"></span>' + live + ' running</span>' +
      '<span style="opacity:.4;margin:0 7px">|</span>' +
      bit(feed, deals.length + ' deal' + (deals.length===1?'':'s'));
    var newest = feed.storedAt||0;
    if (newest){
      var mins = Math.floor((Date.now()-newest)/60000);
      t.textContent = mins < 1 ? 'just now' : mins+'m ago';
    } else t.textContent = '';
  }

  var mailPanel = document.getElementById('mailp');
  document.getElementById('mailHead').onclick = function(){
    mailOpen = !mailOpen; mailPanel.classList.toggle('open', mailOpen); renderMail();
  };

  function renderMail(){
    var v = document.getElementById('mailV'), b = document.getElementById('mailBody');
    if (mailFeed.state === 'ok'){
      v.textContent = mail.human.length ? mail.human.length + ' from people' : 'no people';
      v.classList.toggle('warn', mail.human.length > 0);
    } else if (mailFeed.state === 'error'){ v.textContent = 'offline'; v.classList.remove('warn'); }
    else if (mailFeed.state === 'nomcp'){ v.textContent = 'off'; v.classList.remove('warn'); }
    else { v.textContent = '…'; v.classList.remove('warn'); }
    if (!mailOpen) return;

    if (mailFeed.state !== 'ok'){
      b.innerHTML = '<div class="mnote">' +
        (mailFeed.state === 'nomcp'
          ? 'Open this page inside Claude with the Microsoft 365 connector on.'
          : mailFeed.state === 'error' ? 'Outlook is not answering right now.'
          : 'Checking Outlook…') + '</div>';
      return;
    }
    var h = '';
    if (!mail.human.length){
      h += '<div class="mnote">Nothing from a person. ' + mail.vendor.length +
           ' vendor and automated message' + (mail.vendor.length===1?'':'s') +
           ' out of ' + mail.total + ' in the inbox.</div>';
    } else {
      mail.human.forEach(function(m){
        var age = daysAgo(m.at);
        h += '<div class="mrow" data-link="'+esc(m.link||'')+'">'+
             '<div class="s">'+esc(m.subject || '(no subject)')+'</div>'+
             '<div class="f">'+esc(m.fromName)+' · '+(age===0?'today':age+'d ago')+
             (m.unread?' · unread':'')+'</div></div>';
      });
      h += '<div class="mnote" style="font-style:normal;padding-top:8px;">'+
           mail.vendor.length+' vendor / automated hidden</div>';
    }
    b.innerHTML = h;
    Array.prototype.forEach.call(b.querySelectorAll('.mrow'), function(r){
      r.onclick = function(){
        var l = r.getAttribute('data-link');
        if (l) window.open(l,'_blank','noopener');
      };
    });
  }

  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- drawer ---------- */

  var dw = document.getElementById('dw');
  function openDrawer(id){ activeId = id; renderDrawer(); dw.classList.add('open'); renderList(); }
  function closeDrawer(){ activeId = null; dw.classList.remove('open'); renderList(); }
  document.getElementById('dwClose').onclick = closeDrawer;
  document.getElementById('dwScrim').onclick = closeDrawer;

  function renderDrawer(){
    var s = signalById(activeId);
    if (!s){ closeDrawer(); return; }
    var d = group(s.dist);
    var eye = document.getElementById('dEye');
    eye.textContent = d.name + ' · ' + (s.kind === 'deal' ? 'Live from HubSpot' :
      s.kind === 'work' ? (SURFACE[s.work.surface] || 'Chat') : 'Tracked here');
    eye.style.color = d.css;
    document.getElementById('dTitle').textContent = s.title;
    var sub = document.getElementById('dSub');
    sub.textContent = s.status;
    sub.style.color = s.needs ? 'var(--amber)' : (s.done ? 'var(--go)' : 'var(--text-dim)');

    var kv = document.getElementById('dDetail'), rows = '';
    if (s.kind === 'work'){
      rows += '<dt>Company</dt><dd>'+esc(d.name)+'</dd>';
      rows += '<dt>Where</dt><dd>'+esc(SURFACE[s.work.surface] || 'Chat')+
              (s.work.home ? ' <span style="color:var(--text-faint)">· '+esc(s.work.home)+'</span>' : '')+'</dd>';
      rows += '<dt>Status</dt><dd>'+esc(s.wstat.label)+'</dd>';
      rows += '<dt>Last touched</dt><dd>'+(s.age===null?'<span style="color:var(--text-faint)">never</span>':s.age===0?'today':s.age===1?'yesterday':s.age+' days ago')+'</dd>';
      if (s.work.link) rows += '<dt>Link</dt><dd style="color:var(--text-dim);word-break:break-all">'+esc(s.work.link.replace(/^https?:\/\//,''))+'</dd>';
    } else if (s.kind === 'deal'){
      rows += '<dt>Stage</dt><dd>'+esc(s.stage.label)+'</dd>';
      rows += '<dt>Last touched</dt><dd>'+(s.age===0?'today':s.age+' days ago')+'</dd>';
      if (s.deal.amount) rows += '<dt>Amount</dt><dd>'+s.deal.currency+' '+s.deal.amount.toLocaleString()+'</dd>';
      else rows += '<dt>Amount</dt><dd style="color:var(--text-faint)">not set</dd>';
      rows += '<dt>Close date</dt><dd>'+(s.deal.closedate ? new Date(s.deal.closedate).toLocaleDateString() : '<span style="color:var(--text-faint)">not set</span>')+'</dd>';
      if (s.deal.created) rows += '<dt>Created</dt><dd>'+new Date(s.deal.created).toLocaleDateString()+'</dd>';
    } else {
      rows += '<dt>District</dt><dd>'+esc(d.name)+'</dd>';
      rows += '<dt>Status</dt><dd>'+(s.done?'Done':'Open')+'</dd>';
      if (s.done) rows += '<dt>Marked</dt><dd>'+new Date(doneMap[s.id]).toLocaleDateString()+'</dd>';
      rows += '<dt>Source</dt><dd>Tracked in this workspace</dd>';
    }
    kv.innerHTML = rows;

    var why = document.getElementById('dWhy');
    if (s.kind === 'work'){
      why.textContent = s.work.note ? s.work.note :
        s.work.status === 'blocked' ? 'Stopped until you decide something or hand something over.' :
        s.work.status === 'review'  ? 'The work is done. It is waiting on you to look at it.' :
        s.stale ? 'Open for ' + s.age + ' days with nothing moving. Either pick it back up or park it — a board full of quiet threads stops meaning anything.' :
        s.work.status === 'parked'  ? 'Deliberately paused. Not a failure, just not now.' :
        s.work.status === 'shipped' ? 'Done and out.' :
        'Running. Nothing needed from you right now.';
    } else if (s.kind === 'deal'){
      why.textContent = s.needs
        ? 'No activity for ' + s.age + ' days. A deal at ' + s.stage.label + ' that goes quiet usually needs a call, not another email.'
        : 'Open and recently touched. Nothing to do here right now.';
    } else {
      why.textContent = s.done
        ? 'Closed out. Untick it if that changes.'
        : (s.note || 'Open item.');
    }

    var ft = document.getElementById('dFoot');
    ft.innerHTML = '';
    function btn(txt, cls, fn){
      var b = document.createElement('button'); b.className='btn '+cls; b.textContent=txt;
      b.onclick = fn; ft.appendChild(b);
    }
    if (s.kind === 'work'){
      if (s.work.link){
        var dest = /\/project\//.test(s.work.link) ? 'Open the project'
                 : /\/artifact\//.test(s.work.link) ? 'Open the page' : 'Open';
        btn(dest,'link', function(){ window.open(s.work.link,'_blank','noopener'); });
      }
      if (s.work.status !== 'shipped') btn('Touched today','undo', function(){ touchWork(s.work.id); });
      var sel = document.createElement('select');
      sel.className = 'wsel';
      WORK_ORDER.forEach(function(k){
        var o = document.createElement('option');
        o.value = k; o.textContent = WORK_STATUS[k].label;
        if (k === s.work.status) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = function(){ setWorkStatus(s.work.id, sel.value); };
      ft.appendChild(sel);
    } else if (s.kind === 'deal'){
      if (s.deal.url) btn('Open in HubSpot','link', function(){ window.open(s.deal.url,'_blank','noopener'); });
      else { var n=document.createElement('div'); n.className='ftnote'; n.textContent='No record link available'; ft.appendChild(n); }
    } else {
      if (s.done) btn('Mark not done','undo', function(){ toggleMilestone(s.id); });
      else btn('Mark done','pri', function(){ toggleMilestone(s.id); });
    }
  }

  /* ---------- filters, exec ---------- */

  document.getElementById('fAll').onclick   = function(){ setFilter('all'); };
  document.getElementById('fNeeds').onclick = function(){ setFilter('needs'); };
  document.getElementById('fWork').onclick  = function(){ setFilter('work'); };
  function setFilter(mode){
    filterMode = mode;
    needsOnly = (mode === 'needs');
    document.getElementById('fAll').classList.toggle('on', mode==='all');
    document.getElementById('fNeeds').classList.toggle('on', mode==='needs');
    document.getElementById('fWork').classList.toggle('on', mode==='work');
    renderList();
  }

  var execLayer = document.getElementById('execLayer'), ecards = {};
  DISTRICTS.forEach(function(d){
    var e = document.createElement('div');
    e.className='ecard'; e.style.setProperty('--accent', d.css);
    e.innerHTML = '<div class="en"></div><div class="es"></div><div class="bar"><i></i></div>';
    e.onclick = function(){ focusDistrict(d); };
    execLayer.appendChild(e); ecards[d.id] = e;
  });
  document.getElementById('execBtn').onclick = function(){ setExec(!execOn); };
  function setExec(on){
    execOn = on;
    document.getElementById('execBtn').classList.toggle('on', on);
    document.body.classList.toggle('exec', on);
    if (on){ closeDrawer(); camG.set(CITY.x, 0, CITY.z); ZOOM.tgt = 50; } else { camG.set(2,0,8); ZOOM.tgt = 34; }
    renderExec();
  }
  function renderExec(){
    if (!execOn) return;
    DISTRICTS.forEach(function(d){
      var e = ecards[d.id]; if(!e) return;
      var mine = signalsOf(d.id);
      var needs = mine.filter(function(s){return s.needs;}).length;
      var done = mine.filter(function(s){return s.done;}).length;
      var total = mine.length;
      e.querySelector('.en').textContent = d.name;
      var bits = [];
      if (d.feed === 'live') bits.push(deals.length + ' deal' + (deals.length===1?'':'s'));
      if (d.feed === 'dormant') bits.push('dormant');
      bits.push('<span class="'+(needs?'w':'')+'">'+needs+' need you</span>');
      bits.push(done+'/'+total+' done');
      e.querySelector('.es').innerHTML = bits.map(function(b){return '<span>'+b+'</span>';}).join('');
      e.querySelector('.bar i').style.width = (total ? Math.round(done/total*100) : 0)+'%';
      e.classList.toggle('alert', needs>0);
    });
  }
  function positionExec(){
    if (!execOn) return;
    var v = new THREE.Vector3();
    DISTRICTS.forEach(function(d){
      var e = ecards[d.id]; if(!e) return;
      v.set(d.pos.x, 7, d.pos.z).project(camera);
      e.style.transform = 'translate(-50%,-50%) translate('+
        Math.round((v.x*0.5+0.5)*window.innerWidth)+'px,'+
        Math.round((-v.y*0.5+0.5)*window.innerHeight)+'px)';
    });
  }

  /* ==================== boot ==================== */

  var bar = document.getElementById('loadbar'), pct = 0;
  var boot = setInterval(function(){
    pct = Math.min(100, pct + 9 + Math.random()*11);
    bar.style.width = pct+'%';
    if (pct >= 100){
      clearInterval(boot);
      setTimeout(function(){
        document.getElementById('loading').style.opacity='0';
        document.getElementById('hud').classList.add('ready');
        setTimeout(function(){ document.getElementById('loading').style.display='none'; }, 650);
      }, 200);
    }
  }, 85);

  render();
  renderDealPillars();
  renderWorkers();
  initDb();
  startFeed();
  startMailFeed();
  setInterval(renderClocks, 60000);
  animate();

})();
</script>
